name: Release (via Release Please)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions: {}  # default none

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # 1) Let Release Please manage versions, tags, notes, and release PRs.
  release-please:
    name: Release Please
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
      issues: write

    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name:        ${{ steps.rp.outputs.tag_name }}
      version:         ${{ steps.rp.outputs.version }}
      sha:             ${{ steps.rp.outputs.sha }}
    steps:
      - name: Run Release Please
        id: rp
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json


  # 2) Build & publish Python wheel to PyPi.
  build-pypi:
    if: needs.release-please.outputs.release_created == 'true'
    needs: [release-please]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install and Build 🔧
        run: |
          uv build
      - name: Store the distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-pypi:
    if: needs.release-please.outputs.release_created == 'true'
    needs: [build-pypi]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI 📦
        uses: pypa/gh-action-pypi-publish@release/v1

    # 4) Build & publish docs on each release.
  docs:
    if: needs.release-please.outputs.release_created == 'true'
    needs: [release-please]
    uses: ./.github/workflows/docs.yaml
    secrets: inherit
    permissions:
      contents: write
      pages: write
      id-token: write
