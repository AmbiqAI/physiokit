site_name: PhysioKit
site_dir: "site"
site_description: PhysioKit, process raw ambulatory bio-signals
repo_name: AmbiqAI/physiokit
repo_url: https://github.com/AmbiqAI/physiokit
copyright: Copyright &copy; 2025 Ambiq

nav:

  - Home:
    - Home: index.md
    - Getting Started: ./tutorial/quickstart.md
    - Reference: reference/index.md
    - API: api/index.md

  - Getting Started:
    - Quick Start: ./tutorial/quickstart.md
  - Reference:
    - ./reference/index.md
    - ECG: ./reference/ecg.md
    - PPG: ./reference/ppg.md
    - RSP: ./reference/rsp.md
    - IMU: ./reference/imu.md
    - HRV: ./reference/hrv.md
    - Signal: ./reference/signal.md

  - API: api/

theme:
  name: material
  favicon: assets/favicon.png
  logo: assets/logo.png
  icon:
      repo: fontawesome/brands/github-alt
  font:
    text: Roboto
    code: Roboto Mono
  palette:
    - media: "(prefers-color-scheme)"
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-auto
        name: Use system theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to light theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to dark theme
  features:
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    - navigation.top
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.prune
    - navigation.path
    - navigation.footer
    - navigation.tracking
    - navigation.instant
    - navigation.instant.progress
    - navigation.indexes
    - navigation.expand  # navigation.expand or navigation.sections
    - content.tabs.link # all code tabs change simultaneously

plugins:
  - search
  - gen-files:
      scripts:
      - scripts/gen_api_pages.py
  - literate-nav:
      nav_file: summary.md
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          import:
          - https://docs.python.org/3/objects.inv
          - https://numpy.org/doc/stable/objects.inv
          options:
            docstring_style: google
            docstring_section_style: list
            heading_level: 3
            line_length: 120
            show_root_heading: false
            show_symbol_type_heading: true
            group_by_category: true
            show_category_heading: true
            modernize_annotations: true
            filters: ["!^_", "^__init__$"]

extra_css:
  - css/mkdocstrings.css
  - css/termynal.css
  - css/custom.css

extra_javascript:
  - js/termynal.js
  - js/custom.js

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: 'docs/'
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - md_in_html
